<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Kompanzasyon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0d0d0d; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 50px; }
        .card-custom { background-color: #1a1a1a; border: 1px solid #333; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .form-control { background-color: #262626; border: 1px solid #404040; color: #fff; height: 55px; font-size: 1.1rem; border-radius: 8px; }
        .form-control:focus { background-color: #333; color: #fff; border-color: #00d2d3; box-shadow: 0 0 10px rgba(0, 210, 211, 0.3); }
        .btn-neon { background: linear-gradient(45deg, #00d2d3, #0984e3); color: #fff; font-weight: bold; height: 60px; font-size: 1.2rem; border: none; border-radius: 8px; width: 100%; text-transform: uppercase; letter-spacing: 1px; }
        .btn-neon:active { transform: scale(0.98); }
        .result-value { font-size: 2.5rem; font-weight: 800; color: #00d2d3; }
        .label-tech { color: #888; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        .progress { height: 10px; background-color: #333; border-radius: 5px; }
        .step-badge { background-color: #333; border: 1px solid #00d2d3; color: #00d2d3; padding: 5px 10px; border-radius: 4px; margin: 3px; display: inline-block; }
    </style>
</head>
<body>

<div class="container mt-3">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h4 class="fw-bold m-0" style="color:#00d2d3"><i class="fas fa-bolt"></i> KOMP-PRO</h4>
            <small class="text-muted">Mühendislik Hesap Modülü</small>
        </div>
        <div class="badge bg-secondary">V2.0</div>
    </div>

    <div class="card-custom p-4 mb-4">
        <h6 class="label-tech mb-3"><i class="fas fa-sliders-h"></i> Sayaç Değerleri (Fark)</h6>
        <div class="mb-3">
            <input type="number" id="aktif" class="form-control" placeholder="Aktif (kWh)">
        </div>
        <div class="row g-2">
            <div class="col-6">
                <input type="number" id="enduktif" class="form-control" placeholder="Endüktif (kVArh)">
            </div>
            <div class="col-6">
                <input type="number" id="kapasitif" class="form-control" placeholder="Kapasitif (kVArh)">
            </div>
        </div>
        <button onclick="hesapla()" class="btn-neon mt-4">Analiz Et <i class="fas fa-arrow-right ms-2"></i></button>
    </div>

    <div id="sonucAlani" style="display:none;">
        
        <div class="card-custom p-4 mb-3">
            <h6 class="label-tech mb-3">Sistem Sağlığı</h6>
            
            <div class="mb-3">
                <div class="d-flex justify-content-between">
                    <span>Endüktif Oran</span>
                    <span id="endText" class="fw-bold">0%</span>
                </div>
                <div class="progress mt-1">
                    <div id="endBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                </div>
                <small class="text-muted" style="font-size: 0.7rem">Yasal Sınır: %20</small>
            </div>

            <div class="mb-1">
                <div class="d-flex justify-content-between">
                    <span>Kapasitif Oran</span>
                    <span id="kapText" class="fw-bold">0%</span>
                </div>
                <div class="progress mt-1">
                    <div id="kapBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                </div>
                <small class="text-muted" style="font-size: 0.7rem">Yasal Sınır: %15</small>
            </div>
        </div>

        <div class="card-custom p-4 mb-3 text-center border-warning" style="border-color: #00d2d3 !important;">
            <h6 class="label-tech text-white">Gereken Kondansatör Gücü</h6>
            <div class="result-value my-2"><span id="qcSonuc">0</span> <small style="font-size:1rem; color:#fff">kVar</small></div>
            <p class="text-muted small mb-0">Hedef Cosφ: 1.00 referans alınmıştır.</p>
        </div>

        <div class="card-custom p-4">
            <h6 class="label-tech mb-3 text-warning"><i class="fas fa-lightbulb"></i> Uzman Tavsiyesi</h6>
            <p class="small text-muted">Mevcut sisteme eklemen gereken kademeler:</p>
            <div id="oneriKutusu">
                </div>
        </div>
    </div>
</div>

<script>
    // PWA Kaydı
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

    function hesapla() {
        // Verileri Al
        let p = parseFloat(document.getElementById('aktif').value);
        let ri = parseFloat(document.getElementById('enduktif').value); // Endüktif
        let rc = parseFloat(document.getElementById('kapasitif').value); // Kapasitif

        if (!p) { alert("Aktif tüketimi girmeden hesap olmaz usta."); return; }
        if (isNaN(ri)) ri = 0;
        if (isNaN(rc)) rc = 0;

        // 1. Oran Hesapları
        let endOran = (ri / p) * 100;
        let kapOran = (rc / p) * 100;

        // 2. Ekranı Aç
        document.getElementById('sonucAlani').style.display = 'block';

        // 3. Bar Grafikleri Ayarla
        updateBar('end', endOran, 20);
        updateBar('kap', kapOran, 15);

        // 4. Gereken Kondansatör (Qc) Hesabı
        // Basit saha hesabı: Endüktif yükü güvenli bölgeye (%5 civarı) çekmek.
        // Eğer oran %20'den büyükse müdahale şart.
        // Formül: Qc = P * (tanPhi1 - tanPhi2)
        
        let tanPhi1 = ri / p;
        let tanPhi2 = 0.05; // Hedef
        
        let qc = 0;
        // Sadece endüktif cezadaysa veya sınıra yakınsa öneri verelim
        if (endOran > 10) {
            qc = p * (tanPhi1 - tanPhi2);
        }

        if (qc < 0) qc = 0;
        
        document.getElementById('qcSonuc').innerText = qc.toFixed(1);

        // 5. Akıllı Kademe Önerisi (Greedy Algoritması - Basit Versiyon)
        kademeOner(qc);
    }

    function updateBar(type, val, limit) {
        let bar = document.getElementById(type + 'Bar');
        let text = document.getElementById(type + 'Text');
        
        let percent = val > 100 ? 100 : val; // Bar taşmasın
        bar.style.width = percent + '%';
        text.innerText = '%' + val.toFixed(1);

        if (val > limit) {
            bar.className = 'progress-bar bg-danger'; // Kırmızı
            text.className = 'fw-bold text-danger';
        } else if (val > (limit - 5)) {
            bar.className = 'progress-bar bg-warning'; // Sarı (Risk)
        } else {
            bar.className = 'progress-bar bg-success'; // Yeşil
            text.className = 'fw-bold text-success';
        }
    }

    function kademeOner(ihtiyac) {
        let kutu = document.getElementById('oneriKutusu');
        kutu.innerHTML = ''; // Temizle

        if (ihtiyac <= 0.5) {
            kutu.innerHTML = '<span class="text-success">Sistem stabil, müdahaleye gerek yok.</span>';
            return;
        }

        // Standart Kondansatör Değerleri
        let standartlar = [50, 40, 30, 25, 20, 15, 12.5, 10, 7.5, 5, 2.5, 1.5, 1];
        let kalan = ihtiyac;
        let onerilenler = [];

        // Basit dağılım mantığı
        standartlar.forEach(kap => {
            while (kalan >= kap * 0.9) { // %90'ını karşılıyorsa o kondansatörü ekle
                onerilenler.push(kap);
                kalan -= kap;
            }
        });

        if (onerilenler.length === 0 && kalan > 0.5) onerilenler.push('1'); // En küçük at

        let html = '';
        if (onerilenler.length > 0) {
            onerilenler.forEach(val => {
                html += `<div class="step-badge">${val} kVar</div>`;
            });
            html += `<br><small class="text-muted mt-2 d-block">Toplam ${onerilenler.length} kademe eklenebilir.</small>`;
        } else {
            html = '<span class="text-muted">Hesaplanan değer çok düşük.</span>';
        }
        
        kutu.innerHTML = html;
    }
</script>

</body>
</html>
